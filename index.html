<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST Glory Bot</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b0f19;color:#fff}
.container{max-width:900px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-size:24px;font-weight:800}.badge{background:#171e2e;padding:8px 12px;border-radius:20px;color:#aebcff}
.hero{background:linear-gradient(135deg,#151c31,#101522);padding:24px;border-radius:20px;border:1px solid #252d42}
.hero h1{margin:0 0 8px;font-size:30px}.muted{color:#9aa5bb}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.card{background:#111827;border:1px solid #252d42;border-radius:16px;padding:18px}
.num{font-size:25px;font-weight:800;margin-top:7px}
.section{margin-top:22px}
.section h2{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;background:#111827;border:1px solid #252d42;padding:14px 16px;border-radius:13px;margin:9px 0}
.rank{width:35px;font-weight:800}.name{flex:1}.glory{font-weight:800}
button{border:0;border-radius:10px;padding:11px 15px;background:#5865f2;color:white;font-weight:700;cursor:pointer}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #30394f;background:#0c1220;color:#fff;margin:6px 0 10px}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
@media(max-width:650px){.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">🏆 ST Glory Bot</div>
<div class="badge">V1 Prototype</div>
</header>

<div class="hero">
<h1 id="guildName">ST KINGDOM</h1>
<div class="muted">Guild Glory Management Dashboard</div>
<div class="stats">
<div class="card"><div class="muted">Total Glory</div><div class="num" id="total">0</div></div>
<div class="card"><div class="muted">Members</div><div class="num" id="count">0</div></div>
<div class="card"><div class="muted">Top Player</div><div class="num" id="top">-</div></div>
</div>
</div>

<div class="section">
<h2>🏆 Weekly Leaderboard</h2>
<div id="list"></div>
</div>

<div class="section card">
<h2>➕ Add Member</h2>
<div class="form">
<div><label class="muted">Player Name</label><input id="name" placeholder="Player name"></div>
<div><label class="muted">Glory</label><input id="glory" type="number" min="0" placeholder="0"></div>
<button onclick="addMember()">Add</button>
</div>
</div>
</div>

<script>
let members = [
 {name:"SATHSARA",glory:18500},
 {name:"PLAYER_X",glory:16200},
 {name:"DARK BOY",glory:14750},
 {name:"ST KING",glory:12100},
 {name:"NIGHT FF",glory:9800}
];

function render(){
 members.sort((a,b)=>b.glory-a.glory);
 document.getElementById("total").textContent=members.reduce((s,m)=>s+m.glory,0).toLocaleString();
 document.getElementById("count").textContent=members.length;
 document.getElementById("top").textContent=members[0]?.name || "-";
 document.getElementById("list").innerHTML=members.map((m,i)=>`
 <div class="row">
   <div class="rank">${i<3?["🥇","🥈","🥉"][i]:i+1}</div>
   <div class="name">${m.name}</div>
   <div class="glory">${m.glory.toLocaleString()} Glory</div>
 </div>`).join("");
}
function addMember(){
 const name=document.getElementById("name").value.trim();
 const glory=Number(document.getElementById("glory").value);
 if(!name || glory<0){alert("Player name and valid Glory required.");return}
 members.push({name,glory});
 document.getElementById("name").value="";
 document.getElementById("glory").value="";
 render();
}
render();
</script>
</body>
</html>
