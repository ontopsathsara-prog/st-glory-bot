<script>
function speakGirl(text){
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'en-US';
  msg.pitch = 1.4; // kella wage
  msg.rate = 0.95;
  // female voice hoyagannawa
  let voices = speechSynthesis.getVoices();
  let female = voices.find(v=>v.name.includes('Female')||v.name.includes('Zira')||v.name.includes('Google UK English Female'));
  if(female) msg.voice = female;
  speechSynthesis.speak(msg);
}
